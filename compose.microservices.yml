# Local isolated Development; internal gRPC is not exposed to the host.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  identity-db:
    image: postgres:17
    environment:
      POSTGRES_DB: parking_identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run New-DevelopmentEnv.ps1}
    volumes:
      - identity-data:/var/lib/postgresql/data
      - ./database/services/identity/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d parking_identity"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  parking-db:
    image: postgres:17
    environment:
      POSTGRES_DB: parking_parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${PARKING_DB_PASSWORD:?Run New-DevelopmentEnv.ps1}
    volumes:
      - parking-data:/var/lib/postgresql/data
      - ./database/services/parking/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_parking"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  payment-db:
    image: postgres:17
    environment:
      POSTGRES_DB: parking_payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run New-DevelopmentEnv.ps1}
    volumes:
      - payment-data:/var/lib/postgresql/data
      - ./database/services/payment/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d parking_payment"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  ai-db:
    image: postgres:17
    environment:
      POSTGRES_DB: parking_ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:?Run New-DevelopmentEnv.ps1}
    volumes:
      - ai-data:/var/lib/postgresql/data
      - ./database/services/ai/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d parking_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  identity:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Identity/Parking.Identity.Api/Parking.Identity.Api.csproj
        APP_DLL: Parking.Identity.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ports__Bind: 0.0.0.0
      Ports__Http: 8080
      Ports__Grpc: 8081
      Jwt__Key: ${JWT_KEY:?Run New-DevelopmentEnv.ps1}
      Grpc__ServiceKey: ${GRPC_SERVICE_KEY:?Run New-DevelopmentEnv.ps1}
      ConnectionStrings__Service: "Host=identity-db;Database=parking_identity;Username=identity;Password=${IDENTITY_DB_PASSWORD}"
      Services__IdentityGrpc: http://identity:8081
      Services__ParkingGrpc: http://parking:8081
      Services__AIGrpc: http://ai:8081
      PasswordReset__OtpSecret: ${OTP_HMAC_KEY:?Run New-DevelopmentEnv.ps1 -Ensure}
      Email__Sender: ${SMTP_SENDER:-}
      Email__AppPassword: ${SMTP_PASSWORD:-}
      Email__SmtpServer: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Mfa__EncryptionKey: ${MFA_ENCRYPTION_KEY:?Run New-DevelopmentEnv.ps1 -Ensure}
      SeedAdmin__Email: ${BOOTSTRAP_EMAIL:?Set administrator email}
      SeedAdmin__Password: ${BOOTSTRAP_PASSWORD:?Run New-DevelopmentEnv.ps1}
      SeedAdmin__FullName: Docker demo administrator
      SeedStaff__Email: ${DEMO_STAFF_EMAIL:?Run New-DevelopmentEnv.ps1 -Ensure}
      SeedStaff__Password: ${DEMO_STAFF_PASSWORD:?Run New-DevelopmentEnv.ps1 -Ensure}
      SeedStaff__FullName: Docker demo staff
    depends_on:
      identity-db:
        condition: service_healthy
    restart: unless-stopped
  parking:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Parking/Parking.Parking.Api/Parking.Parking.Api.csproj
        APP_DLL: Parking.Parking.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ports__Bind: 0.0.0.0
      Ports__Http: 8080
      Ports__Grpc: 8081
      Qr__SigningKey: ${QR_SIGNING_KEY:?Run New-DevelopmentEnv.ps1 -Ensure}
      Jwt__Key: ${JWT_KEY:?Run New-DevelopmentEnv.ps1}
      Grpc__ServiceKey: ${GRPC_SERVICE_KEY:?Run New-DevelopmentEnv.ps1}
      ConnectionStrings__Service: "Host=parking-db;Database=parking_parking;Username=parking;Password=${PARKING_DB_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Services__IdentityGrpc: http://identity:8081
      Services__ParkingGrpc: http://parking:8081
      Services__AIGrpc: http://ai:8081
      Services__PaymentGrpc: http://payment:8081
    depends_on:
      parking-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  payment:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Payment/Parking.Payment.Api/Parking.Payment.Api.csproj
        APP_DLL: Parking.Payment.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ports__Bind: 0.0.0.0
      Ports__Http: 8080
      Ports__Grpc: 8081
      Qr__SigningKey: ${QR_SIGNING_KEY:?Run New-DevelopmentEnv.ps1 -Ensure}
      Jwt__Key: ${JWT_KEY:?Run New-DevelopmentEnv.ps1}
      Grpc__ServiceKey: ${GRPC_SERVICE_KEY:?Run New-DevelopmentEnv.ps1}
      ConnectionStrings__Service: "Host=payment-db;Database=parking_payment;Username=payment;Password=${PAYMENT_DB_PASSWORD}"
      Services__IdentityGrpc: http://identity:8081
      Services__ParkingGrpc: http://parking:8081
      Services__AIGrpc: http://ai:8081
      VNPay__RefundsEnabled: ${VNPAY_REFUNDS_ENABLED:-false}
      VNPay__ApiUrl: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPay__RefundIpAddress: ${VNPAY_REFUND_IP:-}
      VNPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VNPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      Frontend__BaseUrl: http://localhost:3000
      VNPay__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:8080/api/v1/payments/vnpay/return}
    depends_on:
      payment-db:
        condition: service_healthy
    restart: unless-stopped
  ai-vision:
    build:
      context: ./src/Services/AI/ai_vision_service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVER_PID=$$!
        sleep 3
        ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}
        wait $$SERVER_PID
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  ai:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/AI/Parking.AI.Api/Parking.AI.Api.csproj
        APP_DLL: Parking.AI.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ports__Bind: 0.0.0.0
      Ports__Http: 8080
      Ports__Grpc: 8081
      Jwt__Key: ${JWT_KEY:?Run New-DevelopmentEnv.ps1}
      Grpc__ServiceKey: ${GRPC_SERVICE_KEY:?Run New-DevelopmentEnv.ps1}
      ConnectionStrings__Service: "Host=ai-db;Database=parking_ai;Username=ai;Password=${AI_DB_PASSWORD}"
      Services__IdentityGrpc: http://identity:8081
      Services__ParkingGrpc: http://parking:8081
      Services__AIGrpc: http://ai:8081
      AiVision__ServiceUrl: http://ai-vision:8000
      AI__OcrEndpoint: ${OCR_ENDPOINT:-http://ai-vision:8000/ocr/recognize}
      AI__OcrApiKey: ${OCR_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      AI__GeminiApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-2.5-flash}
      Ollama__Endpoint: ${DOCKER_OLLAMA_ENDPOINT:-http://ollama:11434}
      AI__OllamaEndpoint: ${DOCKER_OLLAMA_ENDPOINT:-http://ollama:11434}
      Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:3b}
      AI__OllamaModel: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ai-db:
        condition: service_healthy
      ai-vision:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Gateway/Parking.Gateway/Parking.Gateway.csproj
        APP_DLL: Parking.Gateway.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      RateLimit__PermitLimit: 600
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      identity:
        condition: service_healthy
      parking:
        condition: service_healthy
      payment:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend_parking_system
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
volumes:
  identity-data:
  parking-data:
  payment-data:
  ai-data:
  ollama-data:
