
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Parking Area 3D</title>

    <link rel="stylesheet" href="/css/style.css">

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
          }
        }
    </script>
</head>

<body>
    <div class="header">
        <h2>Outdoor Parking Area 3D</h2>
        <p>Parking Structure Visualization</p>
    </div>

    <button id="exportBtn">
        Export 3D Model
    </button>

    <div class="barrier-controls">
        <button id="entranceBtn">
            Open / Close Entrance
        </button>

        <button id="exitBtn">
            Open / Close Exit
        </button>
    </div>

    <div id="slotInfo" class="slot-info">
        <h3>Parking Slot Information</h3>

        <p>
            <strong>Slot ID:</strong>
            <span id="slotId">---</span>
        </p>

        <p>
            <strong>Floor:</strong>
            <span id="slotFloor">---</span>
        </p>

        <p>
            <strong>Vehicle Type:</strong>
            <span id="slotType">---</span>
        </p>

        <p>
            <strong>Status:</strong>
            <span id="slotStatus">---</span>
        </p>

        <p>
            <strong>Width:</strong>
            <span id="slotWidth">---</span>
        </p>

        <p>
            <strong>Length:</strong>
            <span id="slotLength">---</span>
        </p>

        <div class="status-editor">
            <label for="slotStatusSelect">
                Change Slot Status
            </label>

            <select id="slotStatusSelect">
                <option value="AVAILABLE">Available</option>
                <option value="OCCUPIED">Occupied</option>
                <option value="MAINTENANCE">Maintenance</option>
            </select>

            <button id="saveSlotStatus">
                Update Status
            </button>
        </div>

        <button id="closeSlotInfo">Close</button>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
