$kind: http-request
name: 'AI Assistant - Delete Session'
method: DELETE
url: '{{base_url}}/api/v1/ai/assistant/session/{{session_id}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Session deleted", function () {
          const json = pm.response.json();
          pm.expect(json.isSuccess).to.be.true;
          console.log("Session đã xóa:", pm.collectionVariables.get("session_id"));
          pm.collectionVariables.set("session_id", "");
      });
