$kind: http-request
name: 'AI Assistant - Chat (Continue Session)'
method: POST
url: '{{base_url}}/api/v1/ai/assistant/chat'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionId": "{{session_id}}",
      "userId": null,
      "message": "Bãi nào có giá rẻ nhất?",
      "currentParkingLotId": null
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Continued conversation", function () {
          const json = pm.response.json();
          pm.expect(json.isSuccess).to.be.true;
          console.log("AI Reply:", json.result?.reply);
      });
